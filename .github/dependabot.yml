version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Etc/UTC
    versioning-strategy: increase
    open-pull-requests-limit: 10
    ignore:
      # The weekly registry check prepares dedicated Bootstrap upgrades.
      - dependency-name: bootstrap
      # Upgrade Playwright with its container image and screenshot baselines.
      - dependency-name: '@playwright/test'
    groups:
      development-tools:
        dependency-type: development
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:30'
      timezone: Etc/UTC
    commit-message:
      prefix: ci
